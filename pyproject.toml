[project]
name = "zotlib"
version = "0.1.0"
description = "Extract and format bibliographic data from Zotero databases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pymupdf (>=1.26.7,<2.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
]

[project.scripts]
zotlib = "zotlib.cli:app"

[tool.poetry]
packages = [{include = "zotlib"}]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ipykernel = "^6.29.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
