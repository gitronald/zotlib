[project]
name = "zotlib"
version = "0.3.0"
description = "Extract and format bibliographic data from Zotero databases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pymupdf>=1.26.7,<2.0.0",
    "pillow>=12.1.0,<13.0.0",
    "polars>=1.39.2",
]

[project.scripts]
zotlib = "zotlib.cli:app"

[dependency-groups]
dev = ["pytest>=8.0.0", "ipykernel>=6.29.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
